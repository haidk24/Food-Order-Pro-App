[versions]
agp = "8.9.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.13.0"
activity = "1.13.0"
constraintlayout = "2.2.1"
lifecycle    = "2.8.0"          # hoặc 2.8.6 nếu có bản mới hơn
navigation   = "2.9.0"          # cập nhật nếu cần
firebase-bom = "34.11.0"        # BOM mới nhất stable

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
# Lifecycle (định nghĩa alias đúng kiểu kebab-case khuyến nghị)
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycle" }
lifecycle-livedata  = { module = "androidx.lifecycle:lifecycle-livedata", version.ref = "lifecycle" }

# Navigation (nếu chưa có thì thêm)
navigation-fragment = { module = "androidx.navigation:navigation-fragment", version.ref = "navigation" }
navigation-ui       = { module = "androidx.navigation:navigation-ui", version.ref = "navigation" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
# Firebase BOM (định nghĩa kiểu platform)


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }

